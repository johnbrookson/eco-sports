specVersion: "v1"
serviceId: "basketball-net"
# Mesma região do backend do App Hosting: quem consulta o banco é sempre o
# servidor, então os dois ficam juntos (decisão de 2026-11-02, ver
# docs/migracao-firebase.md).
location: "us-east4"
schema:
  source: "./schema"
  datasource:
    postgresql:
      database: "basketball-net"
      cloudSql:
        instanceId: "basketball-net-pg"
connectorDirs: ["./connector"]
