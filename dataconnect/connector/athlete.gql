# Leituras da área logada: o atleta, os eventos dele e os atletas de um
# responsável.
#
# Como as de public.gql, são @auth(level: NO_ACCESS): só o servidor as executa,
# pelo Admin SDK, como administrador. Por isso não usam `auth.uid` (não há
# usuário na execução): a DAL confere a sessão e passa o uid ou o id do atleta
# como variável. Quem chama é responsável por só passar o id de quem pode ver.

query AthleteByUser($userId: String!) @auth(level: NO_ACCESS) {
  athletes(where: { user: { id: { eq: $userId } } }, limit: 1) {
    id
    slug
    firstName
    lastName
    category
    pendingVisibility
  }
}

# Todos os eventos do atleta, inclusive os que o perfil público esconde.
query PerformanceEventsByAthlete($athleteId: UUID!) @auth(level: NO_ACCESS) {
  performanceEvents(
    where: { athleteId: { eq: $athleteId } }
    orderBy: [{ startedAt: DESC }]
  ) {
    id
    sourceType
    startedAt
    endedAt
    season
    context
    metrics
  }
}

# Atletas que o responsável supervisiona (persona parent_guardian).
query ManagedAthletesByGuardian($guardianId: String!) @auth(level: NO_ACCESS) {
  guardianRelationships(
    where: { guardian: { id: { eq: $guardianId } }, status: { eq: active } }
  ) {
    legallyResponsible
    relationshipType
    athlete {
      id
      slug
      firstName
      lastName
      category
      pendingVisibility
    }
  }
}
